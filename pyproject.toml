[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firewatch"
version = "0.1.0"
description = "An always-on agent that reproduces failing CI, fixes it with open models, and proves the fix by re-running your tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
firewatch = "firewatch.cli:main"

[tool.setuptools.packages.find]
include = ["firewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["bench", ".git", ".venv"]
